<section class="ecm">
  <header class="ecm__header">
    <div class="ecm__brand">
      <img class="ecm__logo" src="hyland-agent-logo.png" alt="" />
      <div class="ecm__titles">
        <div class="ecm__appName">Hyland Integrations Agent</div>
        <div class="ecm__appTag">DOCUMENT INTELLIGENCE</div>
      </div>
    </div>
    <div class="ecm__headerRight">
      <button matIconButton type="button" (click)="close()" [attr.aria-label]="'ecm.close' | translate">
        &times;
      </button>
    </div>
  </header>

  <div class="ecm__body">
    <h1 class="ecm__title">{{ 'ecm.title' | translate }}</h1>
    <p class="ecm__subtitle">{{ 'ecm.subtitle' | translate }}</p>

    <div class="ecm__list" *ngIf="loading">
      <div class="ecm__skeleton" *ngFor="let s of skeletons"></div>
    </div>

    <p class="ecm__error" *ngIf="error" role="alert">{{ error }}</p>

    <div class="ecm__list" *ngIf="!loading && !error">
      <button
        *ngFor="let c of configs; let i = index"
        type="button"
        class="ecm__item"
        [class.ecm__item--active]="c.friendlyName === connected"
        [style.animation-delay.ms]="i * 45"
        [disabled]="!!selecting"
        (click)="choose(c)"
      >
        <span class="ecm__name">{{ c.friendlyName }}</span>
        <span class="ecm__hint" *ngIf="c.isDefault">{{ 'ecm.default' | translate }}</span>
        <span class="ecm__badge ecm__badge--{{ badgeCategory(c.systemType) }}" *ngIf="c.systemType">{{ c.systemType }}</span>
        <span class="ecm__connecting" *ngIf="selecting === c.friendlyName">{{ 'ecm.connecting' | translate }}</span>
        <mat-icon
          class="ecm__check"
          svgIcon="check"
          *ngIf="c.friendlyName === connected && selecting !== c.friendlyName"
          aria-hidden="true"
        ></mat-icon>
      </button>
    </div>
  </div>
</section>
