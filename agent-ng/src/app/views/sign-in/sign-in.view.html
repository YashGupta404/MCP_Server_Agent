<section class="signin">
  <mat-card appearance="filled" class="signin__card">
    <div class="signin__logo">
      <img class="signin__logoImg" src="hyland-agent-logo.png" alt="Hyland Integrations Agent" />
    </div>

    <h1 class="signin__title">{{ 'signIn.title' | translate }}</h1>
    <p class="signin__subtitle">{{ 'signIn.subtitle' | translate }}</p>

    <button
      matButton="filled"
      type="button"
      class="signin__btn"
      [disabled]="busy"
      (click)="signIn()"
    >
      {{ (busy ? 'signIn.opening' : 'signIn.continue') | translate }}
    </button>

    <p class="signin__error" *ngIf="error" role="alert">{{ error }}</p>
  </mat-card>
</section>
