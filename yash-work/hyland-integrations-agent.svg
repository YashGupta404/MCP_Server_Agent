<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1e3f"/>
      <stop offset="1" stop-color="#0a1730"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f9e44"/>
      <stop offset="1" stop-color="#20c997"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c7ed6"/>
      <stop offset="1" stop-color="#1864ab"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7048e8"/>
      <stop offset="1" stop-color="#5f3dc4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#20c997"/>
    </marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4dabf7"/>
    </marker>
  </defs>

  <rect width="1680" height="1120" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="0" y="0" width="1680" height="118" fill="#08152c"/>
  <rect x="0" y="116" width="1680" height="3" fill="url(#accent)"/>
  <circle cx="62" cy="59" r="30" fill="url(#accent)"/>
  <text x="62" y="70" text-anchor="middle" font-size="34" font-weight="700" fill="#08152c">H</text>
  <text x="112" y="52" font-size="34" font-weight="700" fill="#ffffff">Hyland Integrations Agent</text>
  <text x="112" y="86" font-size="19" fill="#9fb3d1">An AI content assistant for UCEB — chat, find, capture &amp; view enterprise documents from inside any web app</text>
  <text x="1660" y="44" text-anchor="end" font-size="15" fill="#7f93b3">Model Context Protocol (MCP) · Agent Builder · .NET 8</text>
  <text x="1660" y="70" text-anchor="end" font-size="15" fill="#7f93b3">LOBs: Salesforce (hfs) · Workday (wdx)</text>

  <!-- ===================== FLOW LANE ===================== -->
  <text x="40" y="170" font-size="20" font-weight="700" fill="#20c997">HOW IT WORKS — end-to-end request flow</text>

  <!-- 1 User / Extension -->
  <g filter="url(#shadow)">
    <rect x="40" y="196" width="250" height="196" rx="14" fill="#12294d" stroke="#2f9e44" stroke-width="2"/>
  </g>
  <text x="165" y="230" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Browser Extension</text>
  <text x="165" y="254" text-anchor="middle" font-size="13" fill="#9fb3d1">Chrome / Edge · MV3 side panel</text>
  <text x="60" y="286" font-size="13.5" fill="#cdd9ec">• Chat UI (talk to the agent)</text>
  <text x="60" y="310" font-size="13.5" fill="#cdd9ec">• Context panel: auto-detects the</text>
  <text x="72" y="330" font-size="13.5" fill="#cdd9ec">record on the page (URL / DOM)</text>
  <text x="60" y="354" font-size="13.5" fill="#cdd9ec">• Lists &amp; previews docs in-panel</text>
  <text x="60" y="378" font-size="13.5" fill="#cdd9ec">• Upload / capture files</text>

  <!-- 2 BFF -->
  <g filter="url(#shadow)">
    <rect x="330" y="196" width="230" height="196" rx="14" fill="#12294d" stroke="#1c7ed6" stroke-width="2"/>
  </g>
  <text x="445" y="230" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">BFF</text>
  <text x="445" y="252" text-anchor="middle" font-size="13" fill="#9fb3d1">.NET 8 minimal API · :5010</text>
  <text x="350" y="284" font-size="13.5" fill="#cdd9ec">• Per-user OAuth login</text>
  <text x="362" y="304" font-size="13.5" fill="#cdd9ec">(Auth Code + PKCE)</text>
  <text x="350" y="328" font-size="13.5" fill="#cdd9ec">• Holds client secret +</text>
  <text x="362" y="348" font-size="13.5" fill="#cdd9ec">session tokens</text>
  <text x="350" y="372" font-size="13.5" fill="#cdd9ec">• Proxies chat + uploads</text>

  <!-- 3 Agent Builder cloud -->
  <g filter="url(#shadow)">
    <rect x="600" y="196" width="240" height="196" rx="14" fill="#241a4d" stroke="#7048e8" stroke-width="2"/>
  </g>
  <text x="720" y="228" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Agent Builder</text>
  <text x="720" y="250" text-anchor="middle" font-size="13" fill="#b9a9ef">Hyland cloud · the "host"</text>
  <text x="620" y="282" font-size="13.5" fill="#d6ccf3">• Runs the agent loop</text>
  <text x="620" y="306" font-size="13.5" fill="#d6ccf3">• LLM + system prompt</text>
  <text x="620" y="330" font-size="13.5" fill="#d6ccf3">• Decides which MCP</text>
  <text x="632" y="350" font-size="13.5" fill="#d6ccf3">tool to call</text>
  <text x="620" y="374" font-size="13.5" fill="#d6ccf3">• The MCP client</text>

  <!-- tunnel -->
  <g filter="url(#shadow)">
    <rect x="880" y="238" width="120" height="112" rx="12" fill="#12294d" stroke="#4dabf7" stroke-width="2" stroke-dasharray="6 4"/>
  </g>
  <text x="940" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Dev</text>
  <text x="940" y="306" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Tunnel</text>
  <text x="940" y="330" text-anchor="middle" font-size="11" fill="#9fb3d1">public HTTPS</text>

  <!-- 4 MCP server -->
  <g filter="url(#shadow)">
    <rect x="1040" y="196" width="250" height="196" rx="14" fill="#0f3d33" stroke="#20c997" stroke-width="2.5"/>
  </g>
  <text x="1165" y="228" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">MCP Server</text>
  <text x="1165" y="250" text-anchor="middle" font-size="13" fill="#8ee3c8">.NET 8 · :5200 · the tools</text>
  <text x="1060" y="282" font-size="13.5" fill="#cdeee4">• Exposes 26 MCP tools</text>
  <text x="1060" y="306" font-size="13.5" fill="#cdeee4">• API-Key gate (X-API-Key)</text>
  <text x="1060" y="330" font-size="13.5" fill="#cdeee4">• Signs in to UCEB as the</text>
  <text x="1072" y="350" font-size="13.5" fill="#cdeee4">user (warm-up at startup)</text>
  <text x="1060" y="374" font-size="13.5" fill="#cdeee4">• Token's app-key → LOB route</text>

  <!-- 5 UCEB API -->
  <g filter="url(#shadow)">
    <rect x="1330" y="196" width="310" height="196" rx="14" fill="#12294d" stroke="#1c7ed6" stroke-width="2"/>
  </g>
  <text x="1485" y="228" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">UCEB API</text>
  <text x="1485" y="250" text-anchor="middle" font-size="13" fill="#9fb3d1">Unified Content &amp; Experience Broker</text>
  <text x="1350" y="282" font-size="13.5" fill="#cdd9ec">• Content-services broker</text>
  <text x="1350" y="306" font-size="13.5" fill="#cdd9ec">• Salesforce route: /api/core</text>
  <text x="1350" y="330" font-size="13.5" fill="#cdd9ec">• Workday route: /bow/core</text>
  <text x="1350" y="354" font-size="13.5" fill="#cdd9ec">• Talks to HxP content platform,</text>
  <text x="1362" y="374" font-size="13.5" fill="#cdd9ec">Nucleus &amp; IAM</text>

  <!-- flow arrows -->
  <line x1="290" y1="294" x2="326" y2="294" stroke="#20c997" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="560" y1="294" x2="596" y2="294" stroke="#20c997" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="840" y1="294" x2="876" y2="294" stroke="#20c997" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1000" y1="294" x2="1036" y2="294" stroke="#20c997" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1290" y1="294" x2="1326" y2="294" stroke="#20c997" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="308" y="286" font-size="11" fill="#8ee3c8">HTTPS</text>
  <text x="576" y="286" font-size="11" fill="#8ee3c8">invoke</text>
  <text x="1013" y="286" font-size="11" fill="#8ee3c8">MCP</text>
  <text x="1300" y="286" font-size="11" fill="#8ee3c8">REST</text>

  <!-- ===================== BACKENDS ===================== -->
  <g filter="url(#shadow)">
    <rect x="1330" y="430" width="150" height="92" rx="12" fill="#0d2038" stroke="#1c7ed6" stroke-width="1.5"/>
  </g>
  <text x="1405" y="462" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Salesforce</text>
  <text x="1405" y="484" text-anchor="middle" font-size="12" fill="#9fb3d1">Hyland for</text>
  <text x="1405" y="502" text-anchor="middle" font-size="12" fill="#9fb3d1">Salesforce (hfs)</text>

  <g filter="url(#shadow)">
    <rect x="1490" y="430" width="150" height="92" rx="12" fill="#0d2038" stroke="#1c7ed6" stroke-width="1.5"/>
  </g>
  <text x="1565" y="462" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Workday</text>
  <text x="1565" y="484" text-anchor="middle" font-size="12" fill="#9fb3d1">Hyland for</text>
  <text x="1565" y="502" text-anchor="middle" font-size="12" fill="#9fb3d1">Workday (wdx)</text>

  <line x1="1435" y1="392" x2="1420" y2="426" stroke="#4dabf7" stroke-width="2" marker-end="url(#arrowb)"/>
  <line x1="1545" y1="392" x2="1560" y2="426" stroke="#4dabf7" stroke-width="2" marker-end="url(#arrowb)"/>
  <text x="1350" y="418" font-size="12" fill="#7f93b3">one LOB per running MCP (token decides)</text>

  <!-- ===================== WHAT IT IS ===================== -->
  <g filter="url(#shadow)">
    <rect x="40" y="440" width="600" height="300" rx="14" fill="#0d2038" stroke="#20c997" stroke-width="1.5"/>
  </g>
  <text x="64" y="476" font-size="20" font-weight="700" fill="#20c997">WHAT IT IS</text>
  <text x="64" y="510" font-size="14.5" fill="#dbe6f5">A conversational AI assistant that brings Hyland's enterprise</text>
  <text x="64" y="532" font-size="14.5" fill="#dbe6f5">content management directly into the apps people already use.</text>
  <text x="64" y="562" font-size="14.5" fill="#dbe6f5">Instead of leaving Salesforce or Workday to hunt for a document,</text>
  <text x="64" y="584" font-size="14.5" fill="#dbe6f5">a user just chats — or the side panel auto-shows the documents</text>
  <text x="64" y="606" font-size="14.5" fill="#dbe6f5">tied to the record they're viewing.</text>

  <text x="64" y="642" font-size="15" font-weight="700" fill="#8ee3c8">Built on the Model Context Protocol (MCP):</text>
  <text x="64" y="668" font-size="14" fill="#cdd9ec">the MCP server publishes UCEB operations as standard "tools" that</text>
  <text x="64" y="688" font-size="14" fill="#cdd9ec">any MCP-aware AI host (Agent Builder, Copilot, Claude…) can call —</text>
  <text x="64" y="708" font-size="14" fill="#cdd9ec">turning natural language into real, authenticated content actions.</text>

  <!-- ===================== WHY ===================== -->
  <g filter="url(#shadow)">
    <rect x="670" y="440" width="620" height="300" rx="14" fill="#0d2038" stroke="#1c7ed6" stroke-width="1.5"/>
  </g>
  <text x="694" y="476" font-size="20" font-weight="700" fill="#4dabf7">WHY IT EXISTS</text>
  <text x="694" y="510" font-size="14.5" fill="#dbe6f5">• <tspan font-weight="700" fill="#fff">Content in context</tspan> — documents appear right beside the</text>
  <text x="712" y="530" font-size="14.5" fill="#cdd9ec">business record, no app-switching or manual search.</text>
  <text x="694" y="560" font-size="14.5" fill="#dbe6f5">• <tspan font-weight="700" fill="#fff">Natural language</tspan> — "capture this file to Anthony Rizzo"</text>
  <text x="712" y="580" font-size="14.5" fill="#cdd9ec">instead of navigating UCEB APIs by hand.</text>
  <text x="694" y="610" font-size="14.5" fill="#dbe6f5">• <tspan font-weight="700" fill="#fff">Per-user security</tspan> — every action runs under the signed-in</text>
  <text x="712" y="630" font-size="14.5" fill="#cdd9ec">user's own IAM token; permissions are honored, not bypassed.</text>
  <text x="694" y="660" font-size="14.5" fill="#dbe6f5">• <tspan font-weight="700" fill="#fff">Reusable &amp; multi-LOB</tspan> — one MCP tool set serves multiple</text>
  <text x="712" y="680" font-size="14.5" fill="#cdd9ec">line-of-business integrations (Salesforce, Workday, Outlook…).</text>
  <text x="694" y="710" font-size="14.5" fill="#dbe6f5">• <tspan font-weight="700" fill="#fff">Standards-based</tspan> — MCP means the same tools work with any</text>
  <text x="712" y="730" font-size="14.5" fill="#cdd9ec">future AI host with zero rework.</text>

  <!-- ===================== TOOLS ===================== -->
  <g filter="url(#shadow)">
    <rect x="40" y="770" width="1600" height="310" rx="14" fill="#0d2038" stroke="#7048e8" stroke-width="1.5"/>
  </g>
  <text x="64" y="806" font-size="20" font-weight="700" fill="#b197fc">THE 26 MCP TOOLS — what the agent can actually do</text>

  <!-- column: Auth -->
  <text x="64" y="842" font-size="15" font-weight="700" fill="#20c997">Auth &amp; session</text>
  <text x="64" y="868" font-size="13.5" fill="#cdd9ec">login · logout</text>
  <text x="64" y="890" font-size="13.5" fill="#cdd9ec">start_login_server</text>
  <text x="64" y="912" font-size="13.5" fill="#cdd9ec">get_token_claims</text>
  <text x="64" y="934" font-size="13.5" fill="#cdd9ec">get_authorization_status</text>

  <!-- column: Health -->
  <text x="360" y="842" font-size="15" font-weight="700" fill="#20c997">Health &amp; info</text>
  <text x="360" y="868" font-size="13.5" fill="#cdd9ec">get_health_status</text>
  <text x="360" y="890" font-size="13.5" fill="#cdd9ec">get_build_info</text>
  <text x="360" y="912" font-size="13.5" fill="#cdd9ec">get_platform_capabilities</text>
  <text x="360" y="934" font-size="13.5" fill="#cdd9ec">get_content_platform</text>
  <text x="360" y="956" font-size="13.5" fill="#cdd9ec">evaluate_feature_flag</text>

  <!-- column: Documents -->
  <text x="656" y="842" font-size="15" font-weight="700" fill="#4dabf7">Find &amp; view documents</text>
  <text x="656" y="868" font-size="13.5" fill="#cdd9ec">list_documents</text>
  <text x="656" y="890" font-size="13.5" fill="#cdd9ec">download_document · open_document</text>
  <text x="656" y="912" font-size="13.5" fill="#cdd9ec">open_document_in_viewer</text>
  <text x="656" y="934" font-size="13.5" fill="#cdd9ec">set_viewer_url</text>

  <!-- column: Capture -->
  <text x="656" y="978" font-size="15" font-weight="700" fill="#ffd43b">Capture &amp; upload</text>
  <text x="656" y="1004" font-size="13.5" fill="#cdd9ec">upload_staged_file · upload_document</text>
  <text x="656" y="1026" font-size="13.5" fill="#cdd9ec">upload_document_from_content</text>
  <text x="656" y="1048" font-size="13.5" fill="#cdd9ec">upload_pasted_image</text>
  <text x="656" y="1070" font-size="13.5" fill="#cdd9ec">capture_document · get_capture_default_attributes</text>

  <!-- column: Config -->
  <text x="1120" y="842" font-size="15" font-weight="700" fill="#b197fc">Configuration &amp; metadata</text>
  <text x="1120" y="868" font-size="13.5" fill="#cdd9ec">list_business_object_types</text>
  <text x="1120" y="890" font-size="13.5" fill="#cdd9ec">add_business_object_config</text>
  <text x="1120" y="912" font-size="13.5" fill="#cdd9ec">get_solution_configurations</text>
  <text x="1120" y="934" font-size="13.5" fill="#cdd9ec">list_document_types</text>
  <text x="1120" y="956" font-size="13.5" fill="#cdd9ec">get_document_type_metadata</text>
  <text x="1120" y="978" font-size="13.5" fill="#cdd9ec">list_document_type_groups</text>

  <!-- auth badge -->
  <g filter="url(#shadow)">
    <rect x="1120" y="1000" width="496" height="66" rx="10" fill="#101f39" stroke="#2f9e44" stroke-width="1.5"/>
  </g>
  <text x="1140" y="1028" font-size="13.5" font-weight="700" fill="#8ee3c8">Security model</text>
  <text x="1140" y="1050" font-size="12.5" fill="#cdd9ec">User → BFF (PKCE) → Agent Builder → MCP (API-Key) → UCEB (user token).</text>

  <!-- vertical separators -->
  <line x1="330" y1="828" x2="330" y2="1060" stroke="#1c3355" stroke-width="1"/>
  <line x1="626" y1="828" x2="626" y2="1060" stroke="#1c3355" stroke-width="1"/>
  <line x1="1090" y1="828" x2="1090" y2="1060" stroke="#1c3355" stroke-width="1"/>

  <text x="840" y="1104" text-anchor="middle" font-size="13" fill="#5c7091">Hyland Integrations Agent · UCEB MCP Server + Agent Builder + Browser Extension · architecture overview</text>
</svg>
