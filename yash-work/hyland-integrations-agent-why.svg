<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="920" viewBox="0 0 1680 920" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f9e44"/>
      <stop offset="1" stop-color="#20c997"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f08c00"/>
      <stop offset="1" stop-color="#e8590c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#20c997" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#20c997" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#20c997"/>
    </marker>
  </defs>

  <rect width="1680" height="920" fill="none"/>

  <!-- Header -->
  <text x="70" y="70" font-size="40" font-weight="700" fill="#ffffff">Why we need it</text>
  <text x="70" y="108" font-size="21" fill="#9fb3d1">Every new Line of Business integration is built from scratch — slow, costly and one-off</text>
  <line x1="70" y1="140" x2="1610" y2="140" stroke="#1c3355" stroke-width="2"/>

  <ellipse cx="1120" cy="470" rx="380" ry="300" fill="url(#glow)"/>

  <!-- LEFT: The problem -->
  <g filter="url(#shadow)">
    <rect x="90" y="210" width="620" height="470" rx="22" fill="#2a1710" stroke="#e8590c" stroke-width="2.5"/>
  </g>
  <text x="130" y="266" font-size="26" font-weight="700" fill="#ffd8a8">The problem today</text>
  <text x="130" y="298" font-size="16" fill="#e6b78a">Every integration is a one-off that can't be reused</text>

  <g font-size="18" fill="#f2e6dc">
    <circle cx="146" cy="352" r="7" fill="url(#amber)"/>
    <text x="172" y="358"><tspan font-weight="700" fill="#fff">Per-LOB rebuilds</tspan> — every new Line of Business</text>
    <text x="172" y="384">needs its own custom integration.</text>

    <circle cx="146" cy="430" r="7" fill="url(#amber)"/>
    <text x="172" y="436"><tspan font-weight="700" fill="#fff">Not repeatable</tspan> — existing solutions can't be</text>
    <text x="172" y="462">reused across other lines of business.</text>

    <circle cx="146" cy="508" r="7" fill="url(#amber)"/>
    <text x="172" y="514"><tspan font-weight="700" fill="#fff">Doesn't scale</tspan> — each one means fresh design,</text>
    <text x="172" y="540">code and ongoing maintenance.</text>

    <circle cx="146" cy="586" r="7" fill="url(#amber)"/>
    <text x="172" y="592"><tspan font-weight="700" fill="#fff">Heavy R&amp;D cost</tspan> — significant time and</text>
    <text x="172" y="618">engineering investment before any value.</text>
  </g>

  <!-- Arrow -->
  <line x1="716" y1="445" x2="798" y2="445" stroke="#20c997" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- RIGHT: The solution -->
  <g filter="url(#shadow)">
    <rect x="810" y="210" width="780" height="470" rx="22" fill="#0f3d33" stroke="#20c997" stroke-width="2.5"/>
  </g>
  <text x="850" y="266" font-size="26" font-weight="700" fill="#fff">With the Hyland Integrations Agent</text>
  <text x="850" y="298" font-size="16" fill="#8ee3c8">One repeatable pattern for every Line of Business</text>

  <g font-size="18" fill="#e6f7f1">
    <path d="M844 344 l10 10 l18 -20" stroke="#20c997" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="890" y="358"><tspan font-weight="700" fill="#fff">Build once, reuse</tspan> — the same agent + MCP</text>
    <text x="890" y="384">pattern works across every Line of Business.</text>

    <path d="M844 422 l10 10 l18 -20" stroke="#20c997" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="890" y="436"><tspan font-weight="700" fill="#fff">Repeatable by design</tspan> — new LOBs plug into</text>
    <text x="890" y="462">the same standard interface (MCP / UCEB).</text>

    <path d="M844 500 l10 10 l18 -20" stroke="#20c997" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="890" y="514"><tspan font-weight="700" fill="#fff">Scales effortlessly</tspan> — add a new LOB without</text>
    <text x="890" y="540">re-architecting the solution.</text>

    <path d="M844 578 l10 10 l18 -20" stroke="#20c997" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="890" y="592"><tspan font-weight="700" fill="#fff">Minimal R&amp;D</tspan> — onboard new integrations fast,</text>
    <text x="890" y="618">without significant investment.</text>
  </g>

  <!-- Bottom impact strip -->
  <g filter="url(#shadow)">
    <rect x="90" y="720" width="1500" height="120" rx="16" fill="#0d2038" stroke="#20c997" stroke-width="1.5"/>
  </g>
  <text x="840" y="768" text-anchor="middle" font-size="22" font-weight="700" fill="#20c997">The bottom line</text>
  <text x="840" y="806" text-anchor="middle" font-size="17" fill="#cdd9ec">One repeatable integration pattern — onboard any new Line of Business quickly, without re-inventing the solution or heavy R&amp;D spend.</text>
</svg>
