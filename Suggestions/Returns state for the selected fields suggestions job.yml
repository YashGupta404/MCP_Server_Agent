      url: "{{baseUrl}}/api/classification/suggestions/fields"
      method: GET
      params:
        - name: jobId
          value: ""
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json
      body:
        type: json
        data: |-
          {
