info:
  name: Creates and starts a new classification job.
  type: http
  seq: 1
  tags:
    - Classification

http:
  method: POST
  url: "{{baseUrl}}/api/classification"
  body:
    type: json
    data: |-
      {
        "correlationId": "",
        "jobMetaData": {},
        "configuration": {
          "documentClassDefinitions": [
            {
              "id": "",
              "name": "",
              "description": "",
              "confidenceThreshold": 0,
              "reviewThreshold": 0,
              "classAssignmentThreshold": 0,
              "ignoreForAuto": false
            }
          ],
          "treatEachFileAsDocument": false,
          "includeClassCandidateReasoning": false,
          "reviewThreshold": 0,
          "classAssignmentThreshold": 0,
          "classCandidatesMinDistance": 0,
          "defaultClassId": "",
          "pageLimit": 0,
          "executionProfile": {
            "profileId": "",
            "versionId": "",
            "recognitionProfile": {
              "profileId": "",
              "versionId": ""
            }
          }
        },
        "contentFileReferences": [
          {
            "fileReference": "",
            "sourceUrl": ""
          }
        ],
        "documents": [
          {
            "id": "",
            "pages": [
              {
                "contentFileReferenceIndex": 0,
                "sourcePageIndex": 0,
                "rotation": 0
              }
            ]
          }
        ],
        "executionProfileResolved": {
          "profileId": "",
          "versionId": "",
          "actionTaken": "",
          "recognitionProfile": {
            "profileId": "",
            "versionId": "",
            "actionTaken": ""
          }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

