info:
  name: Classification
  type: folder
  seq: 1

request:
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: "{{token_url}}"
    credentials:
      clientId: "{{client_id}}"
      clientSecret: "{{client_secret}}"
      placement: body
    tokenConfig:
      id: credentials
      placement:
        header: Bearer
    settings:
      autoFetchToken: true
      autoRefreshToken: false
